name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew --no-daemon --console plain build

      - name: Node catalog coverage report
        run: |
          ./gradlew --no-daemon --console plain generateNodeCatalogCoverageReport
          echo "----- node-coverage-report.md -----"
          cat build/generated/nodeCatalog/node-coverage-report.md

      - name: Upload node catalog coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-catalog-coverage
          path: |
            build/generated/nodeCatalog/node-coverage-report.json
            build/generated/nodeCatalog/node-coverage-report.md
          if-no-files-found: warn
