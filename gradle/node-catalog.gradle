/*
 * Build-time NodeCatalog generation.
 * Applied from build.gradle. Produces GeneratedNodeCatalog.java before compileJava.
 */

def nodeCatalogOutputDir = layout.buildDirectory.dir('generated/sources/nodeCatalog/java')
def nodesSourceDir = file('src/main/java/com/nodecraft/nodesystem/nodes')

sourceSets.main.java.srcDir(nodeCatalogOutputDir)

tasks.register('generateNodeCatalog') {
	group = 'nodecraft'
	description = 'Generates GeneratedNodeCatalog from @NodeInfo node sources'
	inputs.dir(nodesSourceDir)
	outputs.dir(nodeCatalogOutputDir)

	doLast {
		def entries = collectNodeCatalogEntries(nodesSourceDir)
		entries.sort { a, b -> a.id <=> b.id }

		def outRoot = nodeCatalogOutputDir.get().asFile
		def packageDir = new File(outRoot, 'com/nodecraft/nodesystem/catalog')
		packageDir.mkdirs()
		def outFile = new File(packageDir, 'GeneratedNodeCatalog.java')

		def sb = new StringBuilder()
		sb.append('package com.nodecraft.nodesystem.catalog;\n\n')
		sb.append('import com.nodecraft.gui.node.NodeInfo;\n')
		sb.append('import com.nodecraft.nodesystem.api.INode;\n')
		sb.append('import com.nodecraft.nodesystem.registry.NodeRegistry;\n\n')
		sb.append('/**\n')
		sb.append(' * Build-time node catalog. GENERATED — do not edit.\n')
		sb.append(' * Regenerated by Gradle task {@code generateNodeCatalog}.\n')
		sb.append(' */\n')
		sb.append('public final class GeneratedNodeCatalog {\n\n')
		sb.append('    public static final int ENTRY_COUNT = ').append(entries.size()).append(';\n\n')
		sb.append('    public static final String[] IDS = {\n')
		entries.each { e ->
			sb.append('        "').append(javaEscape(e.id)).append('",\n')
		}
		sb.append('    };\n\n')
		sb.append('    private GeneratedNodeCatalog() {\n')
		sb.append('    }\n\n')
		sb.append('    /**\n')
		sb.append('     * Registers all catalog entries into {@code registry}.\n')
		sb.append('     *\n')
		sb.append('     * @return number of successful registrations\n')
		sb.append('     */\n')
		sb.append('    public static int register(NodeRegistry registry) {\n')
		sb.append('        int registered = 0;\n')

		entries.each { e ->
			sb.append('        if (add(registry, "')
					.append(javaEscape(e.id)).append('", "')
					.append(javaEscape(e.displayName)).append('", "')
					.append(javaEscape(e.description)).append('", "')
					.append(javaEscape(e.category)).append('", ')
					.append(e.order).append(', "')
					.append(javaEscape(e.icon)).append('", ')
					.append(e.fqcn).append('.class)) {\n')
			sb.append('            registered++;\n')
			sb.append('        }\n')
		}

		sb.append('        return registered;\n')
		sb.append('    }\n\n')
		sb.append('    private static boolean add(\n')
		sb.append('            NodeRegistry registry,\n')
		sb.append('            String id,\n')
		sb.append('            String displayName,\n')
		sb.append('            String description,\n')
		sb.append('            String category,\n')
		sb.append('            int order,\n')
		sb.append('            String icon,\n')
		sb.append('            Class<? extends INode> nodeClass) {\n')
		sb.append('        NodeInfo info = new NodeInfo(id, displayName, description, category, order, nodeClass);\n')
		sb.append('        if (icon != null && !icon.isBlank()) {\n')
		sb.append('            info.setIcon(icon.trim());\n')
		sb.append('        }\n')
		sb.append('        return registry.registerNode(info);\n')
		sb.append('    }\n')
		sb.append('}\n')

		outFile.setText(sb.toString(), 'UTF-8')
		logger.lifecycle("Generated NodeCatalog with ${entries.size()} entries -> ${outFile}")
	}
}

tasks.named('compileJava').configure {
	dependsOn('generateNodeCatalog')
}

tasks.named('sourcesJar').configure {
	dependsOn('generateNodeCatalog')
}

static String javaEscape(String value) {
	if (value == null) {
		return ''
	}
	return value
			.replace('\\', '\\\\')
			.replace('"', '\\"')
			.replace('\r', '')
			.replace('\n', '\\n')
			.replace('\t', '\\t')
}

static List collectNodeCatalogEntries(File nodesDir) {
	def entries = []
	def basePackage = 'com.nodecraft.nodesystem.nodes'
	nodesDir.eachFileRecurse { file ->
		if (!file.name.endsWith('.java') || file.name.contains('$')) {
			return
		}
		def text = file.getText('UTF-8')
		def classMatcher = (text =~ /(?m)public\s+(?:final\s+)?class\s+(\w+)\b/)
		if (!classMatcher.find()) {
			return
		}
		def className = classMatcher.group(1)
		if ((text =~ /public\s+abstract\s+class\s+${java.util.regex.Pattern.quote(className)}\b/).find()) {
			return
		}

		def annoBody = extractNodeInfoBody(text)
		def looksLikeNode =
				(text =~ /extends\s+BaseNode\b/).find() ||
						(text =~ /implements\s+[^{]*\bINode\b/).find()
		if (annoBody == null) {
			// Convention path: only concrete *Node types that look like INode implementations.
			if (!className.endsWith('Node') || !looksLikeNode) {
				return
			}
		}

		def relative = nodesDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
		def packageSuffix = relative.contains('/') ? relative.substring(0, relative.lastIndexOf('/')).replace('/', '.') : ''
		def fqcn = packageSuffix.isEmpty() ? "${basePackage}.${className}" : "${basePackage}.${packageSuffix}.${className}"

		def fields = annoBody != null ? parseAnnotationFields(annoBody) : [:]

		if (isClassDeprecated(text, className)) {
			return
		}

		def inferredCategory = inferCategory(packageSuffix)
		def category = (fields.category ?: inferredCategory ?: '').toString().trim()
		if (category.isEmpty()) {
			return
		}

		def id = (fields.id ?: '').toString().trim()
		if (id.isEmpty()) {
			id = className.toLowerCase()
			if (!id.endsWith('node')) {
				id = id + '_node'
			}
		}

		def displayName = (fields.displayName ?: '').toString().trim()
		if (displayName.isEmpty()) {
			displayName = formatClassName(className)
		}

		def description = (fields.description ?: '').toString()
		def order = 2147483647
		if (fields.order != null) {
			try {
				order = Integer.parseInt(fields.order.toString().trim())
			} catch (NumberFormatException ignored) {
				order = 2147483647
			}
		}
		def icon = (fields.icon ?: '').toString()

		entries << [
				id         : id.toLowerCase(),
				displayName: displayName,
				description: description,
				category   : category,
				order      : order,
				icon       : icon,
				fqcn       : fqcn
		]
	}

	def seen = new HashSet()
	def unique = []
	entries.each { e ->
		if (seen.add(e.id)) {
			unique << e
		} else {
			throw new GradleException("Duplicate node catalog id '${e.id}' (${e.fqcn})")
		}
	}
	return unique
}

static String extractNodeInfoBody(String text) {
	def idx = text.indexOf('@NodeInfo')
	if (idx < 0) {
		return null
	}
	def start = text.indexOf('(', idx)
	if (start < 0) {
		return null
	}
	int depth = 0
	for (int i = start; i < text.length(); i++) {
		char c = text.charAt(i)
		if (c == '"' as char) {
			i++
			while (i < text.length()) {
				char s = text.charAt(i)
				if (s == '\\' as char) {
					i += 2
					continue
				}
				if (s == '"' as char) {
					break
				}
				i++
			}
			continue
		}
		if (c == '(' as char) {
			depth++
		} else if (c == ')' as char) {
			depth--
			if (depth == 0) {
				return text.substring(start + 1, i)
			}
		}
	}
	return null
}

static Map parseAnnotationFields(String body) {
	def fields = [:]
	['id', 'displayName', 'description', 'category', 'order', 'icon'].each { key ->
		def matcher = (body =~ /(?s)\b${key}\s*=\s*("(?:\\.|[^"\\])*"|[^,\n\r)]+)/)
		if (matcher.find()) {
			def raw = matcher.group(1).trim()
			if (raw.startsWith('"') && raw.endsWith('"')) {
				fields[key] = unescapeJavaString(raw.substring(1, raw.length() - 1))
			} else {
				fields[key] = raw
			}
		}
	}
	return fields
}

static String unescapeJavaString(String value) {
	return value
			.replace('\\n', '\n')
			.replace('\\t', '\t')
			.replace('\\"', '"')
			.replace('\\\\', '\\')
}

static boolean isClassDeprecated(String text, String className) {
	def matcher = (text =~ /(?s)((?:@[\w.]+(?:\((?:[^()]|\([^()]*\))*\))?\s*)*)public\s+(?:final\s+)?class\s+${java.util.regex.Pattern.quote(className)}\b/)
	if (!matcher.find()) {
		return false
	}
	return matcher.group(1).contains('@Deprecated')
}

static String inferCategory(String packageSuffix) {
	if (packageSuffix == null || packageSuffix.isEmpty()) {
		return null
	}
	def parts = packageSuffix.split('\\.')
	if (parts.length < 2) {
		return null
	}
	return parts[0] + '.' + parts[1]
}

static String formatClassName(String className) {
	def name = className.endsWith('Node') ? className.substring(0, className.length() - 4) : className
	def result = new StringBuilder()
	for (int i = 0; i < name.length(); i++) {
		char c = name.charAt(i)
		if (i > 0 && Character.isUpperCase(c)) {
			result.append(' ')
		}
		result.append(c)
	}
	return result.toString()
}
