/*
 * Build-time NodeCatalog generation (U0+).
 * Applied from build.gradle.
 *
 * Shared model: gradle/node-catalog-model.gradle
 * Emits:
 *   - build/generated/nodeCatalog/node-catalog.json   (SoT for follow-on artifacts)
 *   - GeneratedNodeCatalog.java                       (runtime registration)
 *   - docs/NODE_LIBRARY.md + NODE_LIBRARY.zh-CN.md    (U1, via node-catalog-docs.gradle)
 *   - ai-node-schema-stub.json                        (U2, via node-catalog-ai-schema.gradle)
 *   - node-icon-manifest.json + node-compatibility-manifest.json (U3)
 *   - node-coverage-report.json + .md                     (U4)
 */

apply from: 'gradle/node-catalog-model.gradle'
apply from: 'gradle/node-catalog-docs.gradle'
apply from: 'gradle/node-catalog-ai-schema.gradle'
apply from: 'gradle/node-catalog-manifests.gradle'
apply from: 'gradle/node-catalog-coverage.gradle'

def nodeCatalogJavaOutputDir = layout.buildDirectory.dir('generated/sources/nodeCatalog/java')
def nodeCatalogModelOutputDir = layout.buildDirectory.dir('generated/nodeCatalog')
def nodesSourceDir = file('src/main/java/com/nodecraft/nodesystem/nodes')

sourceSets.main.java.srcDir(nodeCatalogJavaOutputDir)

tasks.register('generateNodeCatalog') {
	group = 'nodecraft'
	description = 'Generates node-catalog.json + GeneratedNodeCatalog from @NodeInfo sources'
	inputs.dir(nodesSourceDir)
	outputs.dir(nodeCatalogJavaOutputDir)
	outputs.dir(nodeCatalogModelOutputDir)

	doLast {
		def entries = collectNodeCatalogEntries(nodesSourceDir)
		def model = buildNodeCatalogModel(entries)
		validateNodeCatalogModel(model)

		def modelDir = nodeCatalogModelOutputDir.get().asFile
		def modelFile = new File(modelDir, 'node-catalog.json')
		writeNodeCatalogModelJson(modelFile, model)
		logger.lifecycle("Wrote NodeCatalog model (${model.entryCount} entries) -> ${modelFile}")

		def outRoot = nodeCatalogJavaOutputDir.get().asFile
		def packageDir = new File(outRoot, 'com/nodecraft/nodesystem/catalog')
		packageDir.mkdirs()
		def outFile = new File(packageDir, 'GeneratedNodeCatalog.java')
		outFile.setText(renderGeneratedNodeCatalogJava(entries), 'UTF-8')
		logger.lifecycle("Generated NodeCatalog Java (${entries.size()} entries) -> ${outFile}")
	}
}

tasks.register('verifyNodeCatalogModel') {
	group = 'nodecraft'
	description = 'Validates generated node-catalog.json against GeneratedNodeCatalog.IDS'
	dependsOn('generateNodeCatalog')

	doLast {
		def modelFile = new File(nodeCatalogModelOutputDir.get().asFile, 'node-catalog.json')
		if (!modelFile.exists()) {
			throw new GradleException("Missing catalog model: ${modelFile}")
		}
		def model = readNodeCatalogModelJson(modelFile)
		def count = validateNodeCatalogModel(model)

		def javaFile = new File(
				nodeCatalogJavaOutputDir.get().asFile,
				'com/nodecraft/nodesystem/catalog/GeneratedNodeCatalog.java')
		if (!javaFile.exists()) {
			throw new GradleException("Missing GeneratedNodeCatalog: ${javaFile}")
		}
		def javaText = javaFile.getText('UTF-8')
		def countMatcher = (javaText =~ /ENTRY_COUNT\s*=\s*(\d+)/)
		if (!countMatcher.find()) {
			throw new GradleException('GeneratedNodeCatalog missing ENTRY_COUNT')
		}
		def javaCount = Integer.parseInt(countMatcher.group(1))
		if (javaCount != count) {
			throw new GradleException("ENTRY_COUNT ${javaCount} != model entryCount ${count}")
		}

		def modelIds = (model.entries as List).collect { it.id.toString() }
		def idBlockMatcher = (javaText =~ /IDS\s*=\s*\{([^}]*)\}/)
		if (!idBlockMatcher.find()) {
			throw new GradleException('GeneratedNodeCatalog missing IDS array')
		}
		def javaIds = []
		def idMatcher = (idBlockMatcher.group(1) =~ /"((?:\\.|[^"\\])*)"/)
		while (idMatcher.find()) {
			javaIds << idMatcher.group(1)
					.replace('\\n', '\n')
					.replace('\\t', '\t')
					.replace('\\"', '"')
					.replace('\\\\', '\\')
		}
		if (javaIds != modelIds) {
			throw new GradleException('GeneratedNodeCatalog.IDS does not match node-catalog.json entry ids (order-sensitive)')
		}
		logger.lifecycle("Verified NodeCatalog model ↔ Java (${count} entries)")
		verifyNodeLibraryDocsCoverage(model)
		verifyAiNodeSchemaStub(model)
		verifyNodeCatalogManifests(model)
		verifyNodeCatalogCoverageReport(model)
	}
}

tasks.named('generateNodeCatalog').configure {
	finalizedBy(
			'generateNodeLibraryDocs',
			'generateAiNodeSchemaStub',
			'generateNodeCatalogManifests',
			'generateNodeCatalogCoverageReport')
}

tasks.named('verifyNodeCatalogModel').configure {
	dependsOn(
			'generateNodeLibraryDocs',
			'generateAiNodeSchemaStub',
			'generateNodeCatalogManifests',
			'generateNodeCatalogCoverageReport')
}

tasks.named('compileJava').configure {
	dependsOn('generateNodeCatalog')
}

tasks.named('sourcesJar').configure {
	dependsOn('generateNodeCatalog')
}

tasks.named('check').configure {
	dependsOn('verifyNodeCatalogModel')
}

ext.renderGeneratedNodeCatalogJava = { List entries ->
	def sb = new StringBuilder()
	sb.append('package com.nodecraft.nodesystem.catalog;\n\n')
	sb.append('import com.nodecraft.gui.node.NodeInfo;\n')
	sb.append('import com.nodecraft.nodesystem.api.INode;\n')
	sb.append('import com.nodecraft.nodesystem.registry.NodeRegistry;\n\n')
	sb.append('/**\n')
	sb.append(' * Build-time node catalog. GENERATED — do not edit.\n')
	sb.append(' * Regenerated by Gradle task {@code generateNodeCatalog}.\n')
	sb.append(' * Source model: {@code build/generated/nodeCatalog/node-catalog.json}.\n')
	sb.append(' */\n')
	sb.append('public final class GeneratedNodeCatalog {\n\n')
	sb.append('    public static final int ENTRY_COUNT = ').append(entries.size()).append(';\n\n')
	sb.append('    public static final String[] IDS = {\n')
	entries.each { e ->
		sb.append('        "').append(javaEscape(e.id)).append('",\n')
	}
	sb.append('    };\n\n')
	sb.append('    private GeneratedNodeCatalog() {\n')
	sb.append('    }\n\n')
	sb.append('    /**\n')
	sb.append('     * Registers all catalog entries into {@code registry}.\n')
	sb.append('     *\n')
	sb.append('     * @return number of successful registrations\n')
	sb.append('     */\n')
	sb.append('    public static int register(NodeRegistry registry) {\n')
	sb.append('        int registered = 0;\n')

	entries.each { e ->
		sb.append('        if (add(registry, "')
				.append(javaEscape(e.id)).append('", "')
				.append(javaEscape(e.displayName)).append('", "')
				.append(javaEscape(e.description)).append('", "')
				.append(javaEscape(e.category)).append('", ')
				.append(e.order).append(', "')
				.append(javaEscape(e.icon)).append('", ')
				.append(e.fqcn).append('.class)) {\n')
		sb.append('            registered++;\n')
		sb.append('        }\n')
	}

	sb.append('        return registered;\n')
	sb.append('    }\n\n')
	sb.append('    private static boolean add(\n')
	sb.append('            NodeRegistry registry,\n')
	sb.append('            String id,\n')
	sb.append('            String displayName,\n')
	sb.append('            String description,\n')
	sb.append('            String category,\n')
	sb.append('            int order,\n')
	sb.append('            String icon,\n')
	sb.append('            Class<? extends INode> nodeClass) {\n')
	sb.append('        NodeInfo info = new NodeInfo(id, displayName, description, category, order, nodeClass);\n')
	sb.append('        if (icon != null && !icon.isBlank()) {\n')
	sb.append('            info.setIcon(icon.trim());\n')
	sb.append('        }\n')
	sb.append('        return registry.registerNode(info);\n')
	sb.append('    }\n')
	sb.append('}\n')
	return sb.toString()
}
