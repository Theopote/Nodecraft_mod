/*
 * U1: Generate docs/NODE_LIBRARY.md and docs/NODE_LIBRARY.zh-CN.md from
 * build/generated/nodeCatalog/node-catalog.json (shared SoT).
 *
 * See docs/architecture/node-catalog.md
 */

def nodeCatalogModelFile = layout.buildDirectory.file('generated/nodeCatalog/node-catalog.json')
def nodeLibraryEn = file('docs/NODE_LIBRARY.md')
def nodeLibraryZh = file('docs/NODE_LIBRARY.zh-CN.md')

tasks.register('generateNodeLibraryDocs') {
	group = 'nodecraft'
	description = 'Generates NODE_LIBRARY.md / NODE_LIBRARY.zh-CN.md from node-catalog.json'
	dependsOn('generateNodeCatalog')
	inputs.file(nodeCatalogModelFile)
	outputs.files(nodeLibraryEn, nodeLibraryZh)

	doLast {
		def modelFile = nodeCatalogModelFile.get().asFile
		if (!modelFile.exists()) {
			throw new GradleException("Missing catalog model: ${modelFile}")
		}
		def model = readNodeCatalogModelJson(modelFile)
		validateNodeCatalogModel(model)

		def entries = model.entries as List
		nodeLibraryEn.setText(renderNodeLibraryMarkdown(entries, 'en'), 'UTF-8')
		nodeLibraryZh.setText(renderNodeLibraryMarkdown(entries, 'zh'), 'UTF-8')
		logger.lifecycle("Generated NODE_LIBRARY docs (${model.entryCount} nodes) -> ${nodeLibraryEn}, ${nodeLibraryZh}")
	}
}

ext.verifyNodeLibraryDocsCoverage = { Map model ->
	def count = model.entryCount as int
	[nodeLibraryEn, nodeLibraryZh].each { File doc ->
		if (!doc.exists()) {
			throw new GradleException("Missing generated docs: ${doc}")
		}
		def text = doc.getText('UTF-8')
		if (!text.contains("**${count}**")) {
			throw new GradleException("${doc.name} does not report total nodes **${count}**")
		}
		def missing = (model.entries as List).findAll { e ->
			!text.contains('`' + e.id + '`')
		}.collect { it.id }
		if (!missing.isEmpty()) {
			throw new GradleException("${doc.name} missing ${missing.size()} catalog ids (e.g. ${missing.take(5)})")
		}
	}
	logger.lifecycle("Verified NODE_LIBRARY docs cover ${count} catalog ids")
}

ext.renderNodeLibraryMarkdown = { List entries, String locale ->
	boolean zh = locale == 'zh'
	def byCategory = entries.groupBy { it.category.toString() }
	def categories = byCategory.keySet().sort()

	def sb = new StringBuilder()
	if (zh) {
		sb.append('# NodeCraft 节点库\n\n')
		sb.append('- **统计范围**：`src/main/java/com/nodecraft/nodesystem/nodes`\n')
		sb.append('- **节点总数**：**').append(entries.size()).append('**\n')
		sb.append('- **分类总数**：**').append(categories.size()).append('**\n')
		sb.append('- **说明**：由 `node-catalog.json`（`generateNodeCatalog`）自动生成；')
		sb.append('「节点名称」与「说明」取自 `@NodeInfo`（与编辑器一致）。空说明显示为 `-`。\n\n')
		sb.append('## 分类统计\n\n')
		sb.append('| 分类 ID | 节点数 |\n|---|---:|\n')
	} else {
		sb.append('# NodeCraft Node Library\n\n')
		sb.append('- Scope: `src/main/java/com/nodecraft/nodesystem/nodes`\n')
		sb.append('- Total nodes: **').append(entries.size()).append('**\n')
		sb.append('- Total categories: **').append(categories.size()).append('**\n')
		sb.append('- Generated from `node-catalog.json` (`generateNodeCatalog`). Do not edit by hand.\n\n')
		sb.append('## Category Statistics\n\n')
		sb.append('| Category ID | Node Count |\n|---|---:|\n')
	}

	categories.each { cat ->
		sb.append('| `').append(cat).append('` | ').append(byCategory[cat].size()).append(' |\n')
	}
	sb.append('\n')

	categories.each { cat ->
		def group = byCategory[cat].toList()
		group.sort { a, b ->
			int cmp = ((a.order as int) <=> (b.order as int))
			cmp != 0 ? cmp : (a.id.toString() <=> b.id.toString())
		}
		if (zh) {
			sb.append('## ').append(cat).append('（').append(group.size()).append('）\n\n')
			sb.append('| 节点名称 | 节点 ID | 说明 | 类名 |\n|---|---|---|---|\n')
		} else {
			sb.append('## ').append(cat).append(' (').append(group.size()).append(')\n\n')
			sb.append('| Node Name | Node ID | Description | Class |\n|---|---|---|---|\n')
		}
		group.each { e ->
			def simpleClass = simpleClassName(e.fqcn.toString())
			def desc = e.description?.toString()?.trim()
			if (desc == null || desc.isEmpty()) {
				desc = '-'
			}
			sb.append('| ')
					.append(mdCell(e.displayName?.toString() ?: '-')).append(' | `')
					.append(e.id).append('` | ')
					.append(mdCell(desc)).append(' | `')
					.append(simpleClass).append('` |\n')
		}
		sb.append('\n')
	}

	if (zh) {
		sb.append('## 文档生成说明\n\n')
		sb.append('- 本文档由 `./gradlew generateNodeLibraryDocs` 从 `build/generated/nodeCatalog/node-catalog.json` 生成。\n')
		sb.append('- 共享 SoT 与 `GeneratedNodeCatalog` 相同；请勿手改本文件。\n')
		sb.append('- 需要更完整说明时，在对应节点的 `@NodeInfo.description` 中补充后重新生成。\n')
	} else {
		sb.append('## Notes\n\n')
		sb.append('- Generated by `./gradlew generateNodeLibraryDocs` from `build/generated/nodeCatalog/node-catalog.json`.\n')
		sb.append('- Same SoT as `GeneratedNodeCatalog`; do not edit this file by hand.\n')
		sb.append('- To improve docs, fill `description` in each `@NodeInfo` and regenerate.\n')
	}
	return sb.toString()
}

ext.simpleClassName = { String fqcn ->
	if (fqcn == null || fqcn.isEmpty()) {
		return '?'
	}
	int idx = fqcn.lastIndexOf('.')
	return idx >= 0 ? fqcn.substring(idx + 1) : fqcn
}

ext.mdCell = { String value ->
	if (value == null) {
		return '-'
	}
	return value
			.replace('\r\n', ' ')
			.replace('\n', ' ')
			.replace('\r', ' ')
			.replace('|', '\\|')
			.trim()
}
